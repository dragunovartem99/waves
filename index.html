<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>waves</title>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;700;800&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Monoton&display=block"
		/>
	</head>
	<body>
		<input
			id="file"
			type="file"
			accept="audio/*"
		/>
		<canvas id="ride"></canvas>
		<button
			id="pause"
			type="button"
			aria-label="Pause"
			hidden
		></button>
		<section
			id="menu"
			aria-live="polite"
		>
			<p id="menu-title">WAVES</p>
			<p id="menu-note"></p>
			<div
				id="menu-rank"
				hidden
			>
				<dl class="stats">
					<div>
						<dt>SCORE</dt>
						<dd class="score"></dd>
					</div>
					<div>
						<dt>ACCURACY</dt>
						<dd class="reading"></dd>
					</div>
				</dl>
				<div class="window"><div class="scale"></div></div>
			</div>
			<div id="menu-actions"></div>
			<p class="keys">SPACE pause · ← → steer · drop a song anywhere</p>
		</section>
		<script
			type="module"
			src="/src/main.ts"
		></script>
	</body>
</html>
