<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>waves</title>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=JetBrains+Mono:wght@400;700&display=swap"
		/>
	</head>
	<body>
		<input
			id="file"
			type="file"
			accept="audio/*"
		/>
		<canvas id="ride"></canvas>
		<main>
			<h1>waves</h1>
			<p>
				Drop a song anywhere, or
				<label for="file">pick one</label>
			</p>
			<p id="status">No song yet.</p>
			<button
				id="play"
				type="button"
				disabled
			>
				Play
			</button>
			<canvas id="overview"></canvas>
			<canvas id="zoom"></canvas>
		</main>
		<script
			type="module"
			src="/src/main.ts"
		></script>
	</body>
</html>
